<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/bootstrap.min.css"/>
    <script src="https://kit.fontawesome.com/82b50b300e.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
            crossorigin="anonymous"></script>
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.3.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body style="background-image: url(/images/blue.jpg); background-position: center;
    background-attachment: fixed;
    background-size: cover;
    height: 100vh;">

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="/" th:text="#{nav.brand}">Shop</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">

            <li th:unless="${email != null}" class="nav-item">
                <a class="nav-link" href="/users/register" th:text="#{nav.register}">Register</a>
            </li>
            <li th:unless="${email != null}" class="nav-item">
                <a class="nav-link" href="/users/login" th:text="#{nav.login}">Login</a>
            </li>
            <li th:if="${email != null}" class="nav-item">
                <a class="nav-link" href="/users/all" th:text="#{nav.companies}">Companies</a>
            </li>
            <li th:if="${email != null}" class="nav-item">
                <a class="nav-link" href="/users/profile" th:text="#{nav.profile}">Profile</a>
            </li>
            <li th:if="${email != null}" class="nav-item">
                <a class="nav-link" th:href="@{/products/catalog/{category}(category = 'all')}" th:text="#{nav.catalog}">Catalog</a>
            </li>
            <li th:if="${email != null}" class="nav-item">
                <a class="nav-link" href="/products/add-product" th:text="#{nav.add.product}">Add Product</a>
            </li>
            <li th:if="${email != null}" class="nav-item">
                <a class="nav-link" href="/products/my-history" th:text="#{nav.my.history}">My History</a>
            </li>
            <li th:if="${email != null}" class="nav-item" style="right: 15%; position: absolute;">
                <a class="nav-link " href="/products/shopping-cart"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-cart " viewBox="0 0 16 16"><path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg><span th:text="#{nav.shopping.cart}">Shopping Cart</span></a>
            </li>
            <li th:if="${email != null}" class="nav-item" style="right: 8%; position: absolute;">
                <a class="nav-link " href="/users/logout" th:text="#{nav.logout}">Logout</a>
            </li>
            <li class="nav-item" style="right: 4%; position: absolute;">
                <a class="nav-link" href="?lang=en">EN</a>
            </li>
            <li class="nav-item" style="right: 1%; position: absolute;">
                <a class="nav-link" href="?lang=bg">BG</a>
            </li>
        </ul>

    </div>
</nav>

<h1 class="text-center mt-2"><span class="badge badge-pill badge-dark" th:text="#{login.title}">Login</span></h1>
<hr class="hr-3"/>
<form class="mx-auto w-25 bg-blur" th:action="@{/users/login}" th:method="POST">

    <div class="form-group">
        <div class="label-holder text-white d-flex justify-content-center">
            <label for="email" class="h3 mb-2" th:text="#{login.email}">Email</label>
        </div>
        <input type="text" class="form-control" id="email" name="email" th:value="${emailError}"/>
    </div>

    <div class="form-group">
        <div class="label-holder text-white d-flex justify-content-center">
            <label for="password" class="h3 mb-2" th:text="#{login.password}">Password</label>
        </div>
        <input type="password" class="form-control" id="password" name="password"/>
    </div>

    <!--/*@thymesVar id="errors" type="java.lang.String"*/-->
    <p th:if="${errors}" class="errors-1 alert alert-danger" th:text="${errors}"/>

    <div class="button-holder d-flex justify-content-center">
        <button type="submit" class="btn btn-secondary text-white mb-3" th:text="#{login.title}">Login</button>
    </div>
</form>
</body>
</html>
